appId: dev.codelet.desktop
productName: Codelet
copyright: Copyright © 2026 Codelet

directories:
  buildResources: build
  output: release

# 产物名字带上最后一次提交 —— 下载下来一个 dmg，从文件名就知道对应哪个版本。
# hash 由 scripts/dist.mjs 通过环境变量给（没给就报错，不会悄悄用个空值）。
artifactName: ${productName}-${version}-${env.CODELET_COMMIT}-${arch}.${ext}

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.prettierrc,.prettierignore,.gitignore}'

# Pi 依赖的 photon-node 是 wasm，node-pty 需要原生模块，都不能在 asar 里跑
asarUnpack:
  - 'out/ext/**'
  - '**/node_modules/@silvia-odwyer/photon-node/**'
  - '**/node_modules/node-pty/**'

npmRebuild: true
buildDependenciesFromSource: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  darkModeSupport: true
  # 跳过 Electron 自带的本地化 .pak：它们是数据文件，不是可执行文件，本来不该单独签名。
  # 不跳过的话 @electron/osx-sign 会把 Electron Framework 里 220 个 locale.pak 逐个签一遍，
  # 每个还要向 Apple 的时间戳服务打一次往返（实测 1.6 秒/个），一个架构多花六分钟以上。
  # 这些文件仍然被打包签名（_CodeSignature/CodeResources）封住，安全性不受影响。
  signIgnore:
    - '/Resources/[^/]+\.lproj/locale\.pak$'
    - '/Resources/[^/]+\.lproj/[^/]+\.pak$'

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - AppImage
  category: Development
